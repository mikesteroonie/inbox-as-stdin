# The narrowest useful config: the harness pointed at one repository, with
# exactly one human reachable. A good shape for a first run on a real codebase.
#
# Replace `you@example.com` with your own address and fill in the inbox address
# `harness init` prints. Keys go in `.env`, never here.
#
#     cp harness.solo.yaml harness.yaml
#     $EDITOR harness.yaml     # set requester, allowlist.emails, agents[].inbox
#     harness doctor
#     harness up
#
# Blast radius is one person by construction: `allowlist.emails` names a single
# address and `allowlist.domains` is empty, so every other human on earth is
# tier-never. The first blame-outreach email this pod sends can only go to the
# address below.

pod: solo

allowlist:
  # Deliberately empty. A domain entry here would make every address at that
  # domain tier-ask; the point of this config is that exactly one human is
  # reachable.
  domains: []
  emails: [you@example.com]

requester: you@example.com

budgets:
  usd: 5
  max_hops: 6
  questions_per_person_week: 3
  max_concurrent: 3
  max_participants: 10
  dead_thread_ttl_days: 14

envelope: headers

# This repo has a remote and the branch is the deliverable, so let the agent
# open PRs. Set to `never` if you would rather read patches first.
pr: auto

agents:
  - name: backend
    # Replace with the address `harness init` prints for this inbox.
    inbox: backend
    display_name: Backend Agent
    repo: .
    tools: [read, write, bash, send_email_to_agent, ask_code_author]
    model: claude-opus-5
